name: "Main branch Bench"

on:
  push:
    branches: master

jobs:
  changes:
    runs-on: ["nix"]
    outputs:
      should_run: ${{ steps.filter.outputs.watches }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            watches:
              - 'zkml/**'
              - 'mpcs/**'
              - '.github/workflows/main-bench.yml'

  benchmark_master_branch:
    name: Master Benchmarking
    needs: changes
    if: ${{ needs.changes.outputs.should_run == 'true' }}
    permissions:
      checks: write
      contents: read
    runs-on: ['nix']
    steps:
      - name: Sanity check
        if: always()
        run: |
          [ -f $HOME/.gitconfig ] && echo "Removing gitconfig" && rm ${HOME}/.gitconfig || exit 0

      - uses: actions/checkout@v4
        with:
          clean: "false"
          submodules: "recursive"

      - name: Install bencher bin
        shell: devenv shell bash -- -e {0}
        run: cargo install --git https://github.com/bencherdev/bencher --tag v0.5.7 --locked bencher_cli --debug

      - name: Track PR Benchmarks with Bencher
        shell: devenv shell bash -- -e {0}
        run: |
          cd zkml && \
          bencher run \
          --host https://api.bencher.dev \
          --project deep-prove-private-70c58ed-ejzl400nndqc0 \
          --token '${{ secrets.BENCHER_API_TOKEN }}' \
          --branch master \
          --threshold-measure latency \
          --threshold-test percentage \
          --threshold-upper-boundary 0.20 \
          --threshold-max-sample-size 15 \
          --thresholds-reset \
          --testbed ci-runner \
          --err \
          --adapter rust_criterion \
          --github-actions '${{ secrets.GITHUB_TOKEN }}' \
          "cargo bench --bench prove-model"
