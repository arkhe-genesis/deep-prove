name: "Rust tests & lint"
permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - '**'
    branches:
      - master
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for changes in zkML sources
    runs-on: arc-runner-cpx22
    permissions:
      pull-requests: read
      contents: read
    outputs:
      zkml_src: ${{ steps.filter.outputs.zkml_src }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            zkml_src:
              - 'zkml/**'
              - 'mpcs/**'
              - '.github/workflows/tests.yml'
              - 'rust-toolchain.toml'

  test:
    name: Tests
    needs: changes
    if: ${{ needs.changes.outputs.zkml_src != '[]' }}
    runs-on: ['arc-runner-ccx53']
    steps:
      - name: Setup sccache
        uses: Lagrange-Labs/github-workflows/.github/actions/setup-sccache@main

      - name: Sanity check
        if: always()
        run: |
          [ -f $HOME/.gitconfig ] && echo "Removing gitconfig" && rm ${HOME}/.gitconfig || exit 0

      - name: Install xz & LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils git-lfs
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - name: Install devenv
        run: nix-env -i devenv -f '<nixpkgs>'

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Force-check LFS
        run: |
          git lfs install --local
          git lfs pull

      - name: Set RNG seed
        run: |
          seed="$(date +%s)"
          echo RNG seed: "$seed"
          echo RNG_SEED="$seed" >> "$GITHUB_ENV"

      - name: Run cargo check
        shell: devenv shell bash -- -e {0}
        run: cargo check --all --tests --benches
        env:
          RUSTFLAGS: "-W warnings"
          IN_CI: "true"

      - name: Run light tests
        if: github.event.pull_request.draft == true
        shell: devenv shell bash -- -e {0}
        run: cargo nextest run -- --skip test_llm_driver_prove_
        env:
          IN_CI: "true"

      - name: Run all tests
        if: github.event.pull_request.draft == false
        shell: devenv shell bash -- -e {0}
        run: cargo nextest run
        env:
          IN_CI: "true"

      - name: Run doc tests
        shell: devenv shell bash -- -e {0}
        run: cargo test --doc

      - name: Show sccache stats
        run: sccache --show-stats

  linting:
    needs: changes
    if: ${{ needs.changes.outputs.zkml_src != '[]' }}
    runs-on: ['arc-runner-ccx23']
    steps:
      - name: Setup sccache
        uses: Lagrange-Labs/github-workflows/.github/actions/setup-sccache@main
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils git-lfs
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Install devenv
        run: nix-env -i devenv -f '<nixpkgs>'
      - name: Sanity check
        if: always()
        run: |
          [ -f $HOME/.gitconfig ] && echo "Removing gitconfig" && rm ${HOME}/.gitconfig || exit 0

      - uses: actions/checkout@v4
        with:
          clean: "false"
          persist-credentials: false

      - name: Clippy
        shell: devenv shell bash -- -e {0}
        run: CUDARC_CUDA_VERSION=13000 cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust Format
        shell: devenv shell bash -- -e {0}
        run: cargo fmt --all

      - name: Show sccache stats
        run: sccache --show-stats
