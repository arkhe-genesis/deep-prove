name: "Layer Quantization Regression Tests"
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: quant-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ['nix']
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.watches }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            watches:
              - 'tenstore/**'
              - 'utils/**'
              - 'zkml/**'
              - '.github/workflows/layers-quant.yml'

  quantization-validation:
    name: Run Layer Quantization Regression Tests
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ['nix']
    steps:
      - name: Clean previous outputs
        run: |
          rm -r ~/layers-quant 2> /dev/null || true
          rm -r ~/layers-quant-base 2> /dev/null || true

      - name: Set RNG seed
        run: |
          seed="$(date +%s)"
          echo RNG seed: "$seed"
          echo RNG_SEED="$seed" >> "$GITHUB_ENV"

      - name: 'Checkout PR branch'
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: 'Find the merge-base commit hash'
        id: find-branch-point
        env:
          branch_main: ${{ github.event.pull_request.base.ref }}
          branch_topic: ${{ github.event.pull_request.head.ref }}
        run: |
          # Fetch enough history to find a common ancestor commit (aka merge-base):
          git fetch origin ${{ env.branch_topic }} --depth $(( ${{ github.event.pull_request.commits }} + 1 ))
          git fetch origin ${{ env.branch_main }} --depth 50

          BRANCH_POINT=$( git merge-base origin/${{ env.branch_main }} ${{ env.branch_topic }} )
          echo "branch-point: $BRANCH_POINT"
          echo "branch-point=$BRANCH_POINT" >> "$GITHUB_OUTPUT"

      - name: Checkout base
        env:
          branch_point: ${{ steps.find-branch-point.outputs.branch-point }}
        uses: actions/checkout@v4
        with:
          clean: "false"
          lfs: 'true'
          ref: "${{ env.branch_point }}"

      - name: Capture layers outputs on base
        shell: devenv shell bash -- -e {0}
        run: |
          cd zkml
          # Skip tests that require py exported model
          cargo test --release --features capture-layers-quant -- \
            --skip layers::transformer::test::test_gpt2_model_full_pass \
            --skip layers::transformer::test::test_read_gpt2_pytorch_embeddings \
            --skip layers::transformer::test::test_read_gpt2_pytorch_output_first \
            --skip parser::json::test::test_json_tensor_loader \
            --skip layers::transformer::mha::test::test_mha_with_real_values \
            --skip layers::transformer::manual_attention::test_gpt2_model_full_pass \
            --skip layers::transformer::manual_attention::test_read_gpt2_pytorch_embeddings \
            --skip layers::transformer::manual_attention::test_read_gpt2_pytorch_output_first
          mv layers-quant ~/layers-quant-base

      - name: Checkout HEAD
        uses: actions/checkout@v4
        with:
          clean: "false"
          lfs: 'true'
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Force-check LFS
        run: git lfs pull

      - name: Capture layers outputs on HEAD
        shell: devenv shell bash -- -e {0}
        run: |
          cd zkml
          cargo test --release --features capture-layers-quant -- \
            --skip layers::transformer::test::test_gpt2_model_full_pass \
            --skip layers::transformer::test::test_read_gpt2_pytorch_embeddings \
            --skip layers::transformer::test::test_read_gpt2_pytorch_output_first \
            --skip parser::json::test::test_json_tensor_loader \
            --skip layers::transformer::mha::test::test_mha_with_real_values \
            --skip layers::transformer::manual_attention::test_gpt2_model_full_pass \
            --skip layers::transformer::manual_attention::test_read_gpt2_pytorch_embeddings \
            --skip layers::transformer::manual_attention::test_read_gpt2_pytorch_output_first
          mv layers-quant ~/layers-quant
          cp ../scripts/ci/cmp-layers-quant.sh ~

      - name: Compare quantized traces
        shell: devenv shell bash -- -e {0}
        run: |
          cd ~
          ./cmp-layers-quant.sh
