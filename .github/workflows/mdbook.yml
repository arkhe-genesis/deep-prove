name: Deploy mdBook

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'docs/src/**'  # Only trigger when docs are updated
      - 'docs/book.toml'

jobs:
  deploy:
    runs-on: arc-runner-cpx22  
    permissions:
      contents: write
      issues: write
      discussions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - uses: jontze/action-mdbook@v4
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          use-katex: true
      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
      - name: Build Book
        run: |
          cd zkml/docs
          rm -rf book
          mdbook build
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: zkml/docs/book
