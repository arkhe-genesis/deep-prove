[package]
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "deep-prove"
description = "Client stack for the ZKML library"
readme.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = []
# Enable worker's AWS marketplace billing
aws-marketplace = ["dep:aws-config", "dep:aws-sdk-marketplacemetering"]
cuda = ["zkml/cuda"]
# Enable OpenTelemetry tracing
otel = ["telemetry/otel"]

[[bin]]
name = "deep-prove-worker"
path = "src/bin/worker/main.rs"

[[bin]]
name = "deep-prove-cli"
path = "src/bin/cli/main.rs"

[dependencies]
zkml.workspace = true
tenstore.workspace = true

alloy = { version = "1.0.22", default-features = false, features = ["signer-local"] }
alloy-signer = "1.0.25"
anyhow.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-marketplacemetering = { workspace = true, optional = true }
axum = { workspace = true, features = ["http1", "json"] }
base64.workspace = true
bincode.workspace = true
clap = { workspace = true, features = ["cargo", "derive", "env"] }
derive_more = { workspace = true, features = ["from"] }
exponential-backoff.workspace = true
ff_ext = { workspace = true }
futures = { version = "0.3.30" }
humansize = "2.1.3"
machine-uid = "0.5.3"
memmap2.workspace = true
mpcs.workspace = true
object_store.workspace = true
redact = { version = "0.1.11", features = ["zeroize"] }
rmp-serde = { workspace = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
telemetry = { package = "telemetry", path = "../telemetry" }
tempfile.workspace = true
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "fs"] }
tracing.workspace = true
transcript.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
zeroize = "1.8.1"
