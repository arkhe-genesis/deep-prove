[package]
name = "telemetry"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = []
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-semantic-conventions",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
]

[dependencies]
opentelemetry = { version = "0.31.0", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.31.0", optional = true, default-features = false, features = [
  "http-proto",
  "reqwest-client",
] }
opentelemetry-semantic-conventions = { version = "0.31.0", optional = true }
opentelemetry_sdk = { version = "0.31.0", optional = true, features = [
  "rt-tokio",
  "trace",
  "experimental_trace_batch_span_processor_with_async_runtime",
] }
reqwest.workspace = true
tracing = { workspace = true }
tracing-opentelemetry = { version = "0.32.0", optional = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "fmt",
  "json",
] }
ureq = { workspace = true }
