[package]
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "zkml"
description = "ZKML library"
readme.workspace = true
repository.workspace = true
version.workspace = true

[package.metadata.cargo-machete]
ignored = ["prost"]

[[bin]]
name = "bench"
path = "src/bin/bench-cnn.rs"

[[bin]]
name = "bench-llm"
path = "src/bin/bench-llm.rs"

[features]
default = ["cpu"]
# Capture layers' quatization outputs for regression tests
capture-layers-quant = []
cpu = ["burn/ndarray"]
gpu = [
  "burn/wgpu",
  "burn/fusion",
  "dep:burn-cubecl",
  "dep:burn-fusion",
  "dep:cubecl",
]
mem-track = ["utils/mem-track"]

[dependencies]
ahash = "0.8.12"
anyhow.workspace = true
ark-std.workspace = true
average = { version = "0.16.0", features = ["std"] }
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "08d57d86a5b208c830deebcfc7f31af65f24fe00", default-features = false }
burn-cubecl = { git = "https://github.com/tracel-ai/burn.git", rev = "08d57d86a5b208c830deebcfc7f31af65f24fe00", default-features = false, optional = true }
burn-fusion = { git = "https://github.com/tracel-ai/burn.git", rev = "08d57d86a5b208c830deebcfc7f31af65f24fe00", default-features = false, optional = true }
candle-core = "0.9.1"
ceno-p3 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
crossbeam-channel = "0.5.15"
csv.workspace = true
cubecl = { git = "https://github.com/tracel-ai/cubecl", rev = "d1273b10a233e3c1bd40243bed66d206302d7989", optional = true }
derive_more = { workspace = true, features = ["full"] }
either = { workspace = true }
ff_ext = { workspace = true }
get-size2 = "0.6.2"
gguf-rs = "0.1.4"
hex = { workspace = true }
humansize = "2.1.3"
itertools.workspace = true
mpcs = { workspace = true }
multilinear_extensions = { workspace = true, features = ["parallel"] }
p3-field = { workspace = true }
p3-goldilocks = { workspace = true }
petgraph = "0.8.2"
postcard = { version = "1.1.3", features = ["use-std"] }
prost = { version = "0.13.3" }
prost-tract-compat = { package = "prost", version = "0.11.9" }
rayon.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sumcheck.workspace = true
tempfile.workspace = true
tenstore = { path = "../tenstore" }
timed = { workspace = true }
timed-core = { workspace = true }
tokenizers = "0.22.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "fmt",
  "json",
] }
tract-onnx = { workspace = true }
transcript = { workspace = true }
utils = { path = "../utils" }
witness = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "08d57d86a5b208c830deebcfc7f31af65f24fe00", default-features = false, features = [
  "metal",
] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { git = "https://github.com/tracel-ai/burn.git", rev = "08d57d86a5b208c830deebcfc7f31af65f24fe00", default-features = false, features = [
  "vulkan",
] }

[dev-dependencies]
bincode = "2.0.1"
blake3 = { version = "1", features = ["mmap"] }
criterion = { "version" = "0.6", features = ["html_reports"] }
memmap2.workspace = true
ndarray = "0.16.1"
proptest = "1.7.0"
rand = { version = "0.9.2", features = ["std", "std_rng"] }
rstest = "0.25.0"
zstd = "0.13.3"

[[bench]]
harness = false
name = "prove-model"

[[bench]]
harness = false
name = "gpu"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
