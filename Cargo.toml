[workspace]
members = [
  "zkml",
  "deep-prove",
  "utils",
  "tenstore",
  "tenvis",
  "telemetry",
]
resolver = "2"

[workspace.package]
categories = ["cryptography", "zk", "blockchain"]
edition = "2024"
keywords = ["cryptography", "zk", "blockchain"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/LagrangeLabs/deep-prove"
version = "2.0.1"

[workspace.dependencies]
tenstore = { path = "tenstore" }
zkml = { path = "zkml" }

anyhow = { version = "1.0", default-features = false }
ark-bn254 = { version = "0.5.0", features = ["std"] }
ark-ff = { version = "0.5.0", features = ["std"] }
ark-serialize = { version = "0.5.0", features = ["derive"] }
ark-std = "0.5"
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
aws-sdk-marketplacemetering = "1.78"
axum = { version = "0.8" }
base64 = "0.22.1"
bincode = { version = "2.0.1" }
clap = "4"
compact_str = "0.9"
csv = "1.3.1"
derive_more = "2.0.1"
dp-crypto = { git = "https://github.com/Lagrange-Labs/dp-crypto.git", branch = "feat/hkzg_gpu", features = ["parallel"] }
either = "1.15"
exponential-backoff = "2.1.0"
hex = { version = "0.4" }
itertools = "0.13"
memmap2 = "0.9"
object_store = { version = "0.12", features = ["aws"] }
rayon = "1.10"
reqwest = { version = "0.13.1", features = ["json"]}
rmp-serde = "1.3.0"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
test-log = "0.2"
thiserror = "2.0.12"
timed = { git = "https://github.com/nikkolasg/timed-rs" }
timed-core = { git = "https://github.com/nikkolasg/timed-rs" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tokio-metrics = "0.4.6"
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tract-onnx = "0.21"
ureq = { version = "3.1.2", features = ["default", "json"] }
url = "2.5.4"
vise = "0.3.2"
uuid = { version = "1.17.0", features = ["v4"] }

# Test must run fast, but still provides stacktraces.
[profile.test]
debug = true
debug-assertions = true
opt-level = 3
overflow-checks = true

[profile.test.package."*"]
opt-level = 3

[profile.release]
debug = 1
debug-assertions = true
# LTO, even thin, is **very slow** to compile for marginal gains at best
lto = "off"

[profile.fast]
inherits = "release"
lto = "fat"

[patch.crates-io]
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-poly = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }

#[patch."https://github.com/nikkolasg/timed-rs"]
#timed = { path = "/Users/nalos/prog/timed/timed" }
#timed-core = { path = "/Users/nalos/prog/timed/timed-core" }

[workspace.metadata.release]
pre-release-hook = ["sh", "../.github/changelog.sh"]
publish = false
