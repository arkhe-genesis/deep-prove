[package]
name = "arkhe-soc-tlm"
version = "2.0.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
blake3 = "1.3.3"
rand_core = { version = "0.6.4", features = ["std"] }
rand_chacha = "0.3.1"
arkhe-soc-traits = { path = "../arkhe-soc-traits" }
tokio = { version = "1.50.0", features = ["full"] }

[lib]
name = "arkhe_soc_tlm"
path = "src/lib.rs"
